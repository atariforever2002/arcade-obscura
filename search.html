<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Search | Arcade Side B</title>
<meta name="description" content="Search the published Arcade Side B archive.">
<link rel="stylesheet" href="site-search.css">
<style>
:root{--bg:#080b10;--ink:#f2eee6;--line:#293543;--gold:#d39a42;--gold2:#f0c57e;--max:1180px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5;background:radial-gradient(circle at 85% 12%,rgba(112,164,184,.11),transparent 30%),radial-gradient(circle at 12% 28%,rgba(211,154,66,.07),transparent 24%),var(--bg)}
.wrap{width:min(calc(100% - 32px),var(--max));margin:auto}
.hero{padding:34px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--gold);font:800 10px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}
h1{margin:7px 0 9px;font:700 clamp(42px,7vw,70px)/1 Georgia,"Times New Roman",serif}
.deck{max-width:800px;margin:0;color:#b9c4ca;font:18px/1.5 Georgia,"Times New Roman",serif}
main{padding:25px 0 60px}.status{margin:0 0 16px;color:#aeb8be;font-size:13px}.results{display:grid;gap:10px}
.result{display:block;padding:15px 17px;border:1px solid var(--line);background:linear-gradient(145deg,#131b23,#10161d);text-decoration:none;color:inherit}
.result:hover,.result:focus{border-color:#53616d;background:#16202a;outline:none}
.result-type{color:var(--gold);font:800 9px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.result h2{margin:4px 0 5px;font:700 22px Georgia,"Times New Roman",serif}.result p{margin:0;color:#aeb8be;font-size:12px;line-height:1.5}
.result .open{display:block;margin-top:8px;color:var(--gold2);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
mark{background:#5e4722;color:#fff3d9;padding:0 1px}.empty{padding:22px;border:1px solid #5f4b2e;background:#141a20;color:#d3c9b8}
footer{border-top:1px solid var(--line);padding:22px 0 34px;color:#7d8990;font-size:12px}
</style>
</head>
<body>

<div class="asb-global-search" aria-label="Arcade Side B site navigation and search">
  <div class="asb-global-inner">
    <a class="asb-global-brand" href="index.html">Arcade Side B</a>
    <nav class="asb-global-links" aria-label="Archive indexes">
      <a href="companies.html">Companies</a>
      <a href="games.html">Games</a>
      <a href="people.html">People</a>
    </nav>
    <form class="asb-global-form" action="search.html" method="get" role="search">
      <label class="asb-sr-only" for="asb-global-search-input">Search Arcade Side B</label>
      <input id="asb-global-search-input" name="q" type="search" placeholder="Search Arcade Side B…" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </div>
</div>
<section class="hero"><div class="wrap"><div class="eyebrow">Site Search</div><h1>Search Arcade Side B</h1><p class="deck">Search the text of every published Arcade Side B company history, game history, index and research page.</p></div></section>
<main class="wrap"><p class="status" id="search-status">Enter a search above.</p><div class="results" id="search-results" aria-live="polite"></div></main>
<footer><div class="wrap">Arcade Side B · The Overlooked Side of Arcade History</div></footer>
<script>
(function(){
const params=new URLSearchParams(location.search),raw=(params.get('q')||'').trim(),input=document.getElementById('asb-global-search-input'),status=document.getElementById('search-status'),results=document.getElementById('search-results');
if(input) input.value=raw;
const companyPages=new Set(["amenip.html","computer-recreations.html","computran.html","data-east.html","elcon.html","evoga.html","for-play.html","lewlesal.html","mirco-games.html","pacific-novelty.html","ramtek.html","semicom.html","techstar.html","yachiyo.html"]),gamePages=new Set(["captain-silver.html","cobra-gunship.html","colony-7.html","cosmic-guerilla.html","darkmist.html","intrepid.html","minky-monkey.html","sindbad.html","thief.html"]);
function clean(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function re(s){return s.replace(/[|\\{}()[\]^$+*?.-]/g,'\\$&')}
function type(file){if(companyPages.has(file))return'Company history';if(gamePages.has(file))return'Game history';if(file==='companies.html')return'Companies index';if(file==='games.html')return'Games index';if(file==='people.html')return'People index';if(file==='index.html')return'Arcade Side B';return'Research'}
function snippet(text,terms,phrase){const lower=clean(text);let idx=phrase?lower.indexOf(phrase):-1;if(idx<0){for(const t of terms){idx=lower.indexOf(t);if(idx>=0)break}}if(idx<0)idx=0;const start=Math.max(0,idx-115),end=Math.min(text.length,idx+260);let out=(start>0?'…':'')+text.slice(start,end).trim()+(end<text.length?'…':'');let html=esc(out);for(const t of [...terms].sort((a,b)=>b.length-a.length)){if(t.length>1)html=html.replace(new RegExp('('+re(esc(t))+')','ig'),'<mark>$1</mark>')}return html}
async function run(){
if(!raw){results.innerHTML='<div class="empty">Type a game, company, person, place, date, hardware term, or other research subject into the search box above.</div>';return}
const phrase=clean(raw),terms=[...new Set(phrase.split(/\s+/).filter(Boolean))];status.textContent='Searching the published archive for “'+raw+'”…';
let xml;try{const r=await fetch('sitemap.xml',{cache:'no-cache'});if(!r.ok)throw 0;xml=await r.text()}catch(e){status.textContent='The search index could not be loaded. Please try again.';return}
const sm=new DOMParser().parseFromString(xml,'application/xml');
const paths=[...sm.querySelectorAll('loc')].map(n=>{try{return new URL(n.textContent,location.href).pathname.replace(/^\//,'')||'index.html'}catch(e){return null}}).filter(Boolean).filter(p=>p!=='search.html'&&(p==='index.html'||p.endsWith('.html')));
const settled=await Promise.allSettled([...new Set(paths)].map(async path=>{const r=await fetch(path);if(!r.ok)throw 0;const html=await r.text(),doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,noscript,svg,dialog,form,nav,.asb-global-search').forEach(el=>el.remove());const title=(doc.querySelector('h1')?.textContent||doc.title||path).replace(/\s*\|\s*Arcade Side B\s*$/i,'').trim(),desc=(doc.querySelector('meta[name="description"]')?.getAttribute('content')||'').trim(),text=(doc.body?.textContent||'').replace(/\s+/g,' ').trim(),tn=clean(title),dn=clean(desc),xn=clean(text),hay=tn+' '+dn+' '+xn;if(!terms.every(t=>hay.includes(t)))return null;let score=0;if(tn===phrase)score+=300;if(tn.includes(phrase))score+=140;if(dn.includes(phrase))score+=55;if(xn.includes(phrase))score+=35;for(const t of terms){if(tn.includes(t))score+=32;if(dn.includes(t))score+=12;score+=Math.min(xn.split(t).length-1,12)}if(companyPages.has(path)||gamePages.has(path))score+=10;if(['companies.html','games.html','people.html','index.html'].includes(path))score-=4;return{path,title,text,score,type:type(path)}}));
const found=settled.map(x=>x.status==='fulfilled'?x.value:null).filter(Boolean).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title)).slice(0,40);
if(!found.length){status.textContent='No published pages matched “'+raw+'”.';results.innerHTML='<div class="empty">Try a shorter term, a game title, a company name, a person’s surname, or a broader subject.</div>';return}
status.textContent=found.length+(found.length===1?' result':' results')+' for “'+raw+'”.';
results.innerHTML=found.map(r=>'<a class="result" href="'+encodeURI(r.path)+'"><span class="result-type">'+esc(r.type)+'</span><h2>'+esc(r.title)+'</h2><p>'+snippet(r.text,terms,phrase)+'</p><span class="open">Open result →</span></a>').join('');
}
run();
})();
</script>
</body>
</html>
