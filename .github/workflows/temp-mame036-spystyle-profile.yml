name: Temporary MAME 0.36 SpyStyle startup profiler

on:
  push:
    branches:
      - temp-mame036-spystyle-build
    paths:
      - ".github/workflows/temp-mame036-spystyle-profile.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install host utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox xvfb unzip curl

      - name: Download exact MAME 0.36-era build kit
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://arcarc.xmission.com/Web%20Archives/ionpool.net%20%28Dec-31-2020%29/arcade/mame/zips/compilefinal'
          MBASE='https://arcarc.xmission.com/Web%20Archives/ionpool.net%20%28Dec-31-2020%29/arcade/mame/zips'
          mkdir -p kit
          for f in djdev203.zip bnu281b.zip gcc2952b.zip mak3781b.zip all3932.zip zlib113.zip mameseal.zip upx101w.zip; do
            curl -L --fail --retry 3 "$BASE/$f" -o "kit/$f"
          done
          curl -L --fail --retry 3 "$MBASE/mame036s.zip" -o kit/mame036s.zip
          # NASM 0.98 protected-mode DOS binary, compiled with DJGPP (period archive, 1999)
          curl -L --fail --retry 3 "https://apajalista.net/tiedostot/PC/Ohjelmointi/DOS-ohjelmointi_Assembler/NASM098P.ZIP" -o kit/nasm098p.zip
          # CWSDPMI r5 (2000): use independent mirrors so one archive outage does not kill the build
          curl -L --fail --connect-timeout 15 --retry 2 "https://djgpp.mirror.garr.it/current/v2misc/csdpmi5b.zip" -o kit/csdpmi5b.zip || \
            curl -L --fail --connect-timeout 15 --retry 2 "https://ftp.zx.net.nz/pub/archive/ftp.delorie.com/pub/djgpp/current/v2misc/csdpmi5b.zip" -o kit/csdpmi5b.zip

      - name: Assemble period DOS development drive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dosroot/djgpp/bin dosroot/djgpp/mame dosroot/djgpp/zlib
          unzip -q kit/djdev203.zip -d dosroot/djgpp
          unzip -q kit/bnu281b.zip -d dosroot/djgpp
          unzip -q kit/gcc2952b.zip -d dosroot/djgpp
          unzip -q kit/mak3781b.zip -d dosroot/djgpp
          unzip -q kit/all3932.zip -d dosroot/djgpp
          unzip -q kit/mameseal.zip -d dosroot/djgpp
          mkdir -p nasm_tmp
          unzip -q kit/nasm098p.zip -d nasm_tmp
          NASM_DOS=$(find nasm_tmp -type f -iname 'nasm.exe' -print -quit)
          test -n "$NASM_DOS"
          cp "$NASM_DOS" dosroot/djgpp/bin/nasm.exe
          file dosroot/djgpp/bin/nasm.exe
          unzip -q -j kit/upx101w.zip upx.exe -d dosroot/djgpp/bin
          unzip -q -j kit/csdpmi5b.zip -d dosroot/djgpp/bin
          unzip -q kit/zlib113.zip -d dosroot/djgpp/zlib
          unzip -q kit/mame036s.zip -d dosroot/djgpp/mame
          INNER=$(find dosroot/djgpp/mame -maxdepth 1 -iname 'mame.zip' -print -quit)
          test -n "$INNER"
          unzip -q -o "$INNER" -d dosroot/djgpp/mame

      - name: Apply SpyStyle NoNag startup profiling changes
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          root = Path("dosroot/djgpp/mame")
          p = root / "src" / "mame.c"
          s = p.read_text(encoding="latin1")

          old = """\t\t\t\tif (settingsloaded == 0)
          \t\t\t\t{
          \t\t\t\t\t/* if there is no saved config, it must be first time we run this game, */
          \t\t\t\t\t/* so show the disclaimer. */
          \t\t\t\t\tif (showcopyright()) goto userquit;
          \t\t\t\t}

          \t\t\t\tif (showgamewarnings() == 0)  /* show info about incorrect behaviour (wrong colors etc.) */
          """.replace("          ", "")

          new = """#ifndef SPYSTYLE_NONAG
          \t\t\t\tif (settingsloaded == 0)
          \t\t\t\t{
          \t\t\t\t\t/* if there is no saved config, it must be first time we run this game, */
          \t\t\t\t\t/* so show the disclaimer. */
          \t\t\t\t\tif (showcopyright()) goto userquit;
          \t\t\t\t}
          #endif

          #ifdef SPYSTYLE_NONAG
          \t\t\t\tif (1)  /* SpyStyle V.1: bypass warning/game-info startup screens */
          #else
          \t\t\t\tif (showgamewarnings() == 0)  /* show info about incorrect behaviour (wrong colors etc.) */
          #endif
          """.replace("          ", "")

          if old not in s:
              raise SystemExit("Expected MAME 0.36 startup block not found")
          (root / "src" / "mame_original.c").write_text(s, encoding="latin1")
          patched = s.replace(old, new)
          patched = patched.replace(
              "\nuserquit:\n",
              "\n#ifndef SPYSTYLE_NONAG\nuserquit:\n#endif\n"
          )

          # Diagnostic-only startup profiler.  It records clock ticks in RAM during
          # startup and writes STARTUP.LOG only after cpu_run() returns, so CF writes
          # do not distort the startup measurements.
          helper = dedent(r'''
          #include <time.h>
          
          #ifdef SPYSTYLE_PROFILE
          #define SP_PROFILE_MAX 32
          struct sp_profile_entry
          {
              const char *label;
              clock_t ticks;
          };
          static struct sp_profile_entry sp_profile_entries[SP_PROFILE_MAX];
          static int sp_profile_count;
          static clock_t sp_profile_start;
          
          static void sp_profile_begin(void)
          {
              sp_profile_count = 0;
              sp_profile_start = clock();
          }
          
          static void sp_profile_mark(const char *label)
          {
              if (sp_profile_count < SP_PROFILE_MAX)
              {
                  sp_profile_entries[sp_profile_count].label = label;
                  sp_profile_entries[sp_profile_count].ticks = clock() - sp_profile_start;
                  sp_profile_count++;
              }
          }
          
          static void sp_profile_write(void)
          {
              FILE *f;
              int i;
          
              f = fopen("STARTUP.LOG","w");
              if (!f) return;
          
              fprintf(f,"MAME 0.36 SpyStyle startup profile\\n");
              fprintf(f,"Times are relative to run_game() entry.\\n");
              fprintf(f,"External stopwatch time may be longer because EXE load occurs before this point.\\n\\n");
          
              for (i = 0; i < sp_profile_count; i++)
              {
                  long ms = (long)((sp_profile_entries[i].ticks * 1000L) / CLOCKS_PER_SEC);
                  fprintf(f,"%ld.%03ld  %s\\n", ms / 1000L, ms % 1000L,
                          sp_profile_entries[i].label);
              }
          
              fclose(f);
          }
          #else
          #define sp_profile_begin()
          #define sp_profile_mark(x)
          #define sp_profile_write()
          #endif
          ''')

          patched = patched.replace(
              '#include <ctype.h>\n',
              '#include <ctype.h>\n' + helper + '\n',
              1
          )

          patched = patched.replace(
              'int run_game(int game)\n{\n\tint err;\n',
              'int run_game(int game)\n{\n\tint err;\n\n\tsp_profile_begin();\n\tsp_profile_mark("run_game entered");\n',
              1
          )
          patched = patched.replace(
              '\tif (osd_init() == 0)\n\t{',
              '\tsp_profile_mark("before osd_init");\n\tif (osd_init() == 0)\n\t{\n\t\tsp_profile_mark("osd_init complete");',
              1
          )
          patched = patched.replace(
              '\t\t\tshutdown_machine();\n',
              '\t\t\tshutdown_machine();\n\t\t\tsp_profile_mark("shutdown_machine complete");\n\t\t\tsp_profile_write();\n',
              1
          )

          patched = patched.replace(
              'int init_machine(void)\n{\n\tint i;\n',
              'int init_machine(void)\n{\n\tint i;\n\n\tsp_profile_mark("init_machine entered");\n',
              1
          )
          patched = patched.replace(
              '\tif (readroms() != 0)\n\t\tgoto out_free;',
              '\tsp_profile_mark("before readroms");\n\tif (readroms() != 0)\n\t\tgoto out_free;\n\tsp_profile_mark("readroms complete");',
              1
          )
          patched = patched.replace(
              '\tcpu_init();\n',
              '\tcpu_init();\n\tsp_profile_mark("cpu_init complete");\n',
              1
          )
          patched = patched.replace(
              '\tsettingsloaded = load_input_port_settings();\n',
              '\tsettingsloaded = load_input_port_settings();\n\tsp_profile_mark("input settings loaded");\n',
              1
          )
          patched = patched.replace(
              '\tif( !memory_init() )\n\t\tgoto out_free;\n',
              '\tif( !memory_init() )\n\t\tgoto out_free;\n\tsp_profile_mark("memory_init complete");\n',
              1
          )
          patched = patched.replace(
              '\tif (gamedrv->driver_init) (*gamedrv->driver_init)();\n\n\treturn 0;',
              '\tif (gamedrv->driver_init) (*gamedrv->driver_init)();\n\tsp_profile_mark("driver_init complete");\n\n\treturn 0;',
              1
          )

          patched = patched.replace(
              'int run_machine(void)\n{\n\tint res = 1;\n\n\n\tif (vh_open() == 0)',
              'int run_machine(void)\n{\n\tint res = 1;\n\n\tsp_profile_mark("run_machine entered");\n\tsp_profile_mark("before vh_open");\n\tif (vh_open() == 0)',
              1
          )
          patched = patched.replace(
              '\tif (vh_open() == 0)\n\t{\n\t\ttilemap_init();',
              '\tif (vh_open() == 0)\n\t{\n\t\tsp_profile_mark("vh_open complete");\n\t\ttilemap_init();',
              1
          )
          patched = patched.replace(
              '\t\tif (drv->vh_start == 0 || (*drv->vh_start)() == 0)      /* start the video hardware */\n\t\t{',
              '\t\tif (drv->vh_start == 0 || (*drv->vh_start)() == 0)      /* start the video hardware */\n\t\t{\n\t\t\tsp_profile_mark("video hardware start complete");',
              1
          )
          patched = patched.replace(
              '\t\t\tif (sound_start() == 0) /* start the audio hardware */\n\t\t\t{',
              '\t\t\tif (sound_start() == 0) /* start the audio hardware */\n\t\t\t{\n\t\t\t\tsp_profile_mark("sound_start complete");',
              1
          )
          patched = patched.replace(
              '\t\t\t\t\tinit_user_interface();\n',
              '\t\t\t\t\tinit_user_interface();\n\t\t\t\t\tsp_profile_mark("user interface initialized");\n',
              1
          )
          patched = patched.replace(
              '\t\t\t\t\tcpu_run();      /* run the emulation! */',
              '\t\t\t\t\tsp_profile_mark("CPU emulation begins");\n\t\t\t\t\tcpu_run();      /* run the emulation! */\n\t\t\t\t\tsp_profile_mark("CPU emulation returned");',
              1
          )

          p.write_text(patched, encoding="latin1")

          mk = root / "makefile"
          t = mk.read_text(encoding="latin1")
          # Use MAME 0.36's supplied DOS NASM path instead of the default Win32 nasmw path.
          t = t.replace("#ASM = @nasm\nASM = @nasmw", "ASM = @nasm\n#ASM = @nasmw")
          # UPX is size-only; skip packing so the linked DOS EXE can be directly validated.
          t = t.replace("\n\tupx $(EMULATOR_EXE)\n", "\n\t@echo UPX skipped - validation build\n")
          t = t.replace(
              "\n\t$(EMULATOR_EXE) -gamelistheader -noclones > gamelist.txt\n\t$(EMULATOR_EXE) -gamelist -noclones | sort >> gamelist.txt\n\t$(EMULATOR_EXE) -gamelistfooter >> gamelist.txt\n",
              "\n\t@echo Gamelist generation skipped - validate on target Pentium Pro\n"
          )
          t = t.replace(
              "ifdef I686\nEMULATOR_EXE = mameppro.exe\nARCH = -march=pentiumpro",
              "ifdef I686\nEMULATOR_EXE = mameprf.exe\nARCH = -march=pentiumpro"
          )
          t = t.replace(
              'DEFS = -DX86_ASM -DLSB_FIRST -DINLINE="static __inline__" -Dasm=__asm__',
              'DEFS = -DX86_ASM -DLSB_FIRST -DINLINE="static __inline__" -Dasm=__asm__ -DSPYSTYLE_NONAG -DSPYSTYLE_PROFILE'
          )
          mk.write_text(t, encoding="latin1")

          (root / "src" / "version.c").write_text(
              'char build_version[] = "0.36 SpyStyle NoNag Profile V.1 ("__DATE__")";\n',
              encoding="ascii"
          )

      - name: Build with the original 2000 DOS toolchain under DOSBox
        shell: bash
        run: |
          cat > build.conf <<EOF
          [sdl]
          fullscreen=false
          output=surface

          [dosbox]
          memsize=63

          [cpu]
          core=dynamic
          cycles=max
          cycleup=500
          cycledown=500

          [mixer]
          nosound=true

          [autoexec]
          mount c "$GITHUB_WORKSPACE/dosroot"
          c:
          set PATH=C:\\DJGPP\\BIN;%PATH%
          set DJGPP=C:\\DJGPP\\DJGPP.ENV
          echo === Allegro 3.9.32 === > C:\\BUILD.LOG
          cd \\DJGPP\\ALLEGRO
          make lib >> C:\\BUILD.LOG
          make install >> C:\\BUILD.LOG
          echo === zlib 1.1.3 === >> C:\\BUILD.LOG
          cd \\DJGPP\\ZLIB
          make -fmsdos\\makefile.dj2 >> C:\\BUILD.LOG
          copy libz.a C:\\DJGPP\\LIB\\ >> C:\\BUILD.LOG
          copy zlib.h C:\\DJGPP\\INCLUDE\\ >> C:\\BUILD.LOG
          copy zconf.h C:\\DJGPP\\INCLUDE\\ >> C:\\BUILD.LOG
          echo === MAME 0.36 SpyStyle NoNag Profile V.1 Pentium Pro === >> C:\\BUILD.LOG
          cd \\DJGPP\\MAME
          redir -o C:\\MAME.LOG -eo make I686=1
          exit
          EOF
          SDL_AUDIODRIVER=dummy xvfb-run -a dosbox -conf build.conf -exit || true

      - name: Collect build result
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          cp dosroot/BUILD.LOG artifact/BUILD.LOG 2>/dev/null || true
          cp dosroot/MAME.LOG artifact/MAME.LOG 2>/dev/null || true
          MAMEPRF_PATH=$(find dosroot/djgpp/mame -maxdepth 1 -type f -iname 'mameprf.exe' -print -quit)
          if [ -n "$MAMEPRF_PATH" ]; then
            cp "$MAMEPRF_PATH" artifact/MAMEPRF.EXE
          fi
          cp dosroot/djgpp/mame/src/mame.c artifact/mame.c 2>/dev/null || true
          cp dosroot/djgpp/mame/src/mame_original.c artifact/mame_original.c 2>/dev/null || true
          cp dosroot/djgpp/mame/makefile artifact/makefile 2>/dev/null || true
          cp dosroot/djgpp/mame/src/version.c artifact/version.c 2>/dev/null || true
          cp dosroot/djgpp/mame/gamelist.txt artifact/gamelist.txt 2>/dev/null || true
          if [ -f artifact/MAMEPRF.EXE ]; then
            sha256sum artifact/MAMEPRF.EXE | tee artifact/MAMEPRF_SHA256.txt
            file artifact/MAMEPRF.EXE | tee artifact/MAMEPRF_FILETYPE.txt
          else
            echo "MAMEPRF.EXE was not produced. See BUILD.LOG." | tee artifact/BUILD_FAILED.txt
          fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAME036-SPYSTYLE-STARTUP-PROFILE-V1
          path: artifact/
          if-no-files-found: error
