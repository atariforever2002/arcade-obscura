name: Red Husker packed scaler DOS validation
on:
  push:
    branches: [redhusker-packedfill-20261025]
    paths: [".github/workflows/redhusker-packed-runtime.yml"]
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the exact experimental build
        uses: actions/github-script@v7
        with:
          script: |
            for (let i=0;i<120;i++) {
              const r=await github.rest.actions.getWorkflowRun({...context.repo,run_id:40205476066});
              if (r.data.status === 'completed') {
                if (r.data.conclusion !== 'success') throw new Error('DOS build failed: '+r.data.conclusion);
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,60000));
            }
            throw new Error('Timed out waiting for DOS build');
      - uses: actions/download-artifact@v4
        with:
          name: REDHUSKER-PACKEDFILL-20261025
          run-id: 40205476066
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: compiled
      - uses: actions/download-artifact@v4
        with:
          name: LINUX-DOS-LAB-PERIOD-COMPILER-KIT-20261018
          run-id: 39128741566
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preserved
      - name: Prepare isolated DOS runtime and exact-source tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dosbox xvfb unzip
          mkdir -p runtime/djgpp
          unzip -q preserved/kit/djdev203.zip -d runtime/djgpp
          unzip -q preserved/kit/bnu281b.zip -d runtime/djgpp
          unzip -q preserved/kit/gcc2952b.zip -d runtime/djgpp
          unzip -q -j preserved/kit/csdpmi5b.zip -d runtime/djgpp/bin
          cp compiled/MAMEPKD.EXE runtime/
          python3 - <<'PY'
          from pathlib import Path
          c=Path('tests/redhusker-fill/fillfast.c').read_text()
          assert c.strip() in Path('compiled/video-filltest.c').read_text()
          Path('runtime/filltest.c').write_text(c)
          Path('runtime/testfill.c').write_text(Path('tests/redhusker-fill/test_fill.c').read_text())
          commands=['mount c "'+str(Path('runtime').resolve())+'"','c:',
          'set PATH=C:\\DJGPP\\BIN;%PATH%','set DJGPP=C:\\DJGPP\\DJGPP.ENV',
          'gcc -x c -O2 -Wall testfill.c -o testfill.exe > COMPILE.TXT',
          'testfill.exe > PIXEL.TXT','MAMEPKD.EXE -listfull > GAMES.TXT',
          'MAMEPKD.EXE rygar -listroms > ROMLIST.TXT',
          'echo DOS_RUNTIME_RETURNED > RETURNED.TXT','exit']
          Path('runtime.conf').write_text('[sdl]\noutput=surface\n[dosbox]\nmemsize=63\n[cpu]\ncore=dynamic\ncycles=max\n[mixer]\nnosound=true\n[autoexec]\n'+'\n'.join(commands)+'\n')
          PY
          SDL_AUDIODRIVER=dummy timeout 300s xvfb-run -a dosbox -conf runtime.conf -exit
      - name: Verify runtime results
        shell: python
        run: |
          from pathlib import Path
          r=Path('runtime')
          def read(n): return next(p for p in r.iterdir() if p.name.lower()==n.lower()).read_text(errors='replace')
          assert 'PASS:' in read('PIXEL.TXT')
          assert 'rygar' in read('GAMES.TXT').lower()
          assert 'rygar' in read('ROMLIST.TXT').lower()
          assert 'DOS_RUNTIME_RETURNED' in read('RETURNED.TXT')
          Path('runtime/VALIDATION.txt').write_text('PASS: exact production scaler parity under vintage DOS compiler/runtime, MAME listfull and Rygar listroms. No ROM gameplay or real Matrox timing test; no speed claim.\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REDHUSKER-PACKED-DOS-VALIDATION-20261025
          path: runtime/*.TXT
