name: Red Husker Pentium II DOS runtime validation
on:
  push:
    branches: [redhusker-filltest-20261019]
    paths: [".github/workflows/redhusker-fill-runtime.yml"]
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install DOSBox
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox xvfb qemu-system-x86 mtools dosfstools fdisk curl vgabios
      - uses: actions/download-artifact@v4
        with:
          name: REDHUSKER-FILLTEST-20261019
          run-id: 39339615718
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: compiled
      - uses: actions/download-artifact@v4
        with:
          name: LINUX-DOS-LAB-PERIOD-COMPILER-KIT-20261018
          run-id: 39128741566
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preserved
      - name: Assemble isolated DOS runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/djgpp runtime/rygar
          echo 'f62e5feaf2ea1dd86902528996bd27a4ed0a5dce96218b36fbcb6de313f3f85a  compiled/MAMEFILL.EXE' | sha256sum -c -
          cp compiled/MAMEFILL.EXE runtime/
          unzip -q preserved/kit/djdev203.zip -d runtime/djgpp
          unzip -q preserved/kit/bnu281b.zip -d runtime/djgpp
          unzip -q preserved/kit/gcc2952b.zip -d runtime/djgpp
          unzip -q -j preserved/kit/csdpmi5b.zip -d runtime/djgpp/bin
          cp tests/redhusker-fill/test_fill.c runtime/testfill.c
          cp tests/redhusker-fill/filltest.c runtime/filltest.c
          python3 - <<'PY'
          from pathlib import Path
          v=Path('compiled/video-filltest.c').read_text()
          c=Path('tests/redhusker-fill/filltest.c').read_text()
          assert c.strip() in v, 'Test harness must use the exact compiled scaler source'
          root=Path('runtime').resolve()
          commands=[
          'mount c "'+str(root)+'"', 'c:',
          'set PATH=C:\\DJGPP\\BIN;%PATH%',
          'set DJGPP=C:\\DJGPP\\DJGPP.ENV',
          'gcc -x c -O2 -Wall testfill.c -o testfill.exe > COMPILE.TXT',
          'if not exist testfill.exe goto finish',
          'testfill.exe > PIXEL.TXT',
          'MAMEFILL.EXE -listfull > GAMES.TXT',
          'MAMEFILL.EXE rygar -listroms > ROMLIST.TXT',
          'MAMEFILL.EXE rygar -filltest -soundcard 0 > STARTUP.TXT',
          'echo DOS_RUNTIME_RETURNED > RETURNED.TXT',
          ':finish', 'exit']
          Path('runtime.conf').write_text('[sdl]\noutput=surface\n[dosbox]\nmemsize=63\n[cpu]\ncore=dynamic\ncycles=max\n[mixer]\nnosound=true\n[autoexec]\n'+'\n'.join(commands)+'\n')
          PY
      - name: Boot FreeDOS with a Pentium II CPU
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('runtime/exitvm.c')
          p.write_text('#include <pc.h>\nint main(void) { outportw(0xf4,0x10); return 0; }\n')
          c=Path('runtime.conf').read_text()
          c=c[:c.index("MAMEFILL.EXE -listfull")]+"gcc -x c -O2 exitvm.c -o exitvm.exe\nexit\n"
          Path('compile.conf').write_text(c)
          PY
          SDL_AUDIODRIVER=dummy timeout 90s xvfb-run -a dosbox -conf compile.conf -exit
          curl -fL --retry 2 https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.3/official/FD13-FloppyEdition.zip -o freedos.zip
          unzip -q freedos.zip -d freedos
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,shutil
          candidates=[p for p in Path('freedos').rglob('*') if p.is_file() and p.suffix.lower() in ['.img','.ima'] and 'boot' in p.name.lower()]
          assert candidates, list(Path('freedos').rglob('*'))
          candidates.sort(key=lambda p: (p.stat().st_size!=1474560,p.stat().st_size))
          boot=candidates[0]
          shutil.copyfile(boot,'boot.img')
          names=subprocess.check_output(['mdir','-i','boot.img','-/','-b','::'],text=True)
          print(names)
          commands=[n for n in names.splitlines() if n.upper().endswith('/COMMAND.COM') or n.upper().endswith('::COMMAND.COM')]
          assert commands,names
          command=commands[0].replace('::','').replace('/','\\')
          if not command.startswith('\\'): command='\\'+command
          Path('fdconfig.sys').write_bytes(('DOS=LOW\r\nFILES=40\r\nBUFFERS=20\r\nLASTDRIVE=Z\r\nSHELL=A:'+command+' /E:1024 /P=A:\\FDAUTO.BAT\r\n').encode())
          Path('fdauto.bat').write_bytes(('@echo off\r\nC:\r\nCD \\\r\nSET PATH=C:\\DJGPP\\BIN\r\nTESTFILL.EXE > PIXEL.TXT\r\nMAMEFILL.EXE -listfull > GAMES.TXT\r\nMAMEFILL.EXE rygar -listroms > ROMLIST.TXT\r\nMAMEFILL.EXE rygar -filltest -soundcard 0 > STARTUP.TXT\r\necho DOS_RUNTIME_RETURNED > RETURNED.TXT\r\nEXITVM.EXE\r\n').encode())
          PY
          mcopy -o -i boot.img fdconfig.sys ::FDCONFIG.SYS
          mcopy -o -i boot.img fdauto.bat ::FDAUTO.BAT
          truncate -s 128M hdd.img
          echo 'label: dos
          start=2048,type=6,bootable' | sfdisk hdd.img
          mkfs.fat -F 16 --offset 2048 hdd.img
          mcopy -s -i hdd.img@@1048576 runtime/* ::
          set +e
          timeout 120s qemu-system-i386 -machine pc -cpu pentium2 -m 64 -vga std -display none -monitor none -serial none -no-reboot -device isa-debug-exit,iobase=0xf4,iosize=0x04 -drive file=boot.img,format=raw,if=floppy -drive file=hdd.img,format=raw,if=ide -boot a
          result=$?
          set -e
          echo "QEMU exit: $result"
          mkdir -p qemu-results
          mcopy -i hdd.img@@1048576 '::*.TXT' qemu-results/
          mcopy -i hdd.img@@1048576 '::*.CFG' qemu-results/ || true
          test "$result" -eq 33
          cp qemu-results/* runtime/
      - name: Verify actual DOS results
        shell: python
        run: |
          from pathlib import Path
          r=Path('runtime')
          def read(name): return next(p for p in r.iterdir() if p.name.lower()==name.lower()).read_text(errors='replace')
          assert 'PASS:' in read('PIXEL.TXT'), read('COMPILE.TXT')
          games=read('GAMES.TXT').lower()
          for game in ['rygar','rastan','blktiger']: assert game in games, game
          assert 'cpu_5m.bin' in read('ROMLIST.TXT').lower()
          startup=read('STARTUP.TXT').lower()
          assert 'required files are missing' in startup, startup
          assert 'DOS_RUNTIME_RETURNED' in read('RETURNED.TXT')
          cfg=read('mame.cfg').lower()
          assert 'filltest = no' in cfg, cfg
          (r/'VERIFIED.TXT').write_text('PASS: exact compiled MAMEFILL starts in DOS; driver and ROM lists execute; Rygar startup parses -filltest and returns cleanly on expected absent ROMs. Exact scaler source passes 8/16-bit pixel harness under DJGPP/FreeDOS on a QEMU Pentium II. No real game ROM or actual VESA rendering tested. Cabinet speed/sound/controls remain unverified.\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REDHUSKER-FILLTEST-DOS-RUNTIME
          path: |
            runtime/*.TXT
            runtime/*.cfg
            runtime/*.exe
            runtime/*.png
            runtime/*.CFG
            qemu-results/*
          if-no-files-found: error

      - name: Package local isolated emulator for private ROM testing
        if: success()
        run: |
          mkdir -p local-emulator/bin local-emulator/lib local-emulator/share
          cp /usr/bin/qemu-system-i386 /usr/bin/mcopy /usr/bin/mdir local-emulator/bin/
          for program in /usr/bin/qemu-system-i386 /usr/bin/mcopy /usr/bin/mdir; do
            ldd "$program" | awk '/=> \// {print $3}' | xargs -r -I '{}' cp -L '{}' local-emulator/lib/
          done
          cp -a /usr/share/vgabios /usr/share/qemu /usr/share/seabios local-emulator/share/
          cp -a /usr/lib/x86_64-linux-gnu/qemu local-emulator/modules
          find local-emulator/modules -name '*.so' -exec ldd '{}' \; | awk '/=> \// {print $3}' | sort -u | xargs -r -I '{}' cp -L '{}' local-emulator/lib/
          cp boot.img hdd.img local-emulator/
          mkdir -p local-emulator/share/vgabios-current
          curl -fL --retry 2 https://github.com/bochs-emu/VGABIOS/releases/download/v0_9d/vgabios-0.9d-bin.tgz -o vgabios-current.tgz
          tar -xzf vgabios-current.tgz -C local-emulator/share/vgabios-current
          tar -czf local-emulator.tar.gz local-emulator
      - uses: actions/upload-artifact@v4
        with:
          name: REDHUSKER-PRIVATE-TEST-EMULATOR
          path: local-emulator.tar.gz
